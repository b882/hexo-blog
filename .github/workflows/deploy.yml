name: Deploy Hexo Blog

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 同一时间只允许一次部署，避免两个运行互相覆盖目录
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build site
        run: |
          npm ci
          npm run build
          test -f public/index.html

      - name: Upload generated site
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          source: 'public/*'
          target: '/tmp/hexo-blog-deploy-${{ github.run_id }}'
          strip_components: 1

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}

          script: |
            set -eu
            STAGE="/tmp/hexo-blog-deploy-${{ github.run_id }}"
            ROOT="/www/wwwroot/heyubin.top"
            BACKUP="/www/wwwroot/.heyubin.top.bak"

            test -f "$STAGE/index.html"
            mkdir -p "$ROOT"

            # 备份旧站点，后续任何一步失败都能回滚
            rm -rf "$BACKUP" 2>/dev/null || true
            if [ -n "$(ls -A "$ROOT" 2>/dev/null || true)" ]; then
              cp -a "$ROOT" "$BACKUP" || true
            fi

            # 清空旧站点。
            # 必须保留宝塔的 .user.ini：它通常带 chattr +i，rm 会失败并让 set -e 中断，
            # 之前正是因此出现「目录被清空、新文件没复制、站点 403」。
            find "$ROOT" -mindepth 1 -maxdepth 1 ! -name '.user.ini' -exec rm -rf {} + || true

            # 复制新站点，失败自动回滚
            if ! cp -a "$STAGE"/. "$ROOT"/; then
              echo "复制新站点失败，正在回滚旧站点"
              if [ -d "$BACKUP" ]; then cp -a "$BACKUP"/. "$ROOT"/ || true; fi
              exit 1
            fi

            # 关键文件校验，缺失同样回滚
            if [ ! -f "$ROOT/index.html" ]; then
              echo "缺少 index.html，正在回滚旧站点"
              if [ -d "$BACKUP" ]; then cp -a "$BACKUP"/. "$ROOT"/ || true; fi
              exit 1
            fi

            rm -rf "$STAGE"

      - name: Verify site is live
        run: |
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' https://heyubin.top/ || true)"
            if [ "$code" = "200" ]; then
              echo "site is live (HTTP 200)"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code"
            sleep 5
          done
          echo "site did not return HTTP 200 after deploy"
          exit 1
