name: Deploy Hexo Blog on: push: branches: - main jobs: deploy: 
    runs-on: ubuntu-latest steps:
      - name: Checkout uses: actions/checkout@v4 - name: Deploy to 
      Server
        uses: appleboy/ssh-action@v1.0.3 with: host: ${{ 
          secrets.SERVER_HOST }} username: ${{ secrets.SERVER_USER 
          }}
          key: ${{ secrets.SERVER_KEY }} script: | cd 
            /www/wwwroot/hexo-blog git pull origin main npm install 
            hexo clean hexo generate rm -rf 
            /www/wwwroot/heyubin.top/*
            cp -r public/* /www/wwwroot/heyubin.top/
